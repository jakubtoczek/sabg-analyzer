[project]
name = "sabg-analyzer"
dynamic = ["version"]
description = "SABG Analyzer - senescence-associated beta-galactosidase quantification from Zeiss CZI whole-slide scans"
# The whole reason this project used to hunt for a system interpreter: pylibCZIrw
# publishes no wheel past cp313, and czifile / imagecodecs need >=3.12. The
# launcher pins 3.13, so this bound only ever fires for a hand-run `uv sync`.
requires-python = ">=3.12,<3.14"
dependencies = [
    "pylibCZIrw>=6.0,<7",   # tiled / region full-res reads of CZI mosaics
    "czifile>=2026.3",      # slide Label attachment + mosaic tile geometry
    "scikit-image>=0.22",   # colour deconvolution, triangle/otsu thresholds, morphology
    "numpy>=1.24",
    "opencv-python>=4.8",   # fast resize / morphology
    "pandas>=2.0",          # results & sections tables
    "matplotlib>=3.7",      # debug figures + the Preview/Tune canvas
    "PyYAML>=6.0",          # config files
    "openpyxl>=3.1",        # results.xlsx (config.output.workbook, on by default)
]

[project.scripts]
sabg-analyzer = "sabg_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sabg_analyzer", "sabg_gui"]

[tool.hatch.version]
path = "sabg_analyzer/__init__.py"
